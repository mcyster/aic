[package]
name = "aic"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Command-line access to agentic services"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
